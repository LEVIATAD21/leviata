<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">KAWA-AI — orquestração local em movimento</title>
  <desc id="desc">Núcleo de IA, caminhos de dados, memória adaptativa e proteção local em uma animação contínua.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#dbffff" stop-opacity=".98"/><stop offset=".25" stop-color="#71f5ee" stop-opacity=".72"/><stop offset="1" stop-color="#38cbd4" stop-opacity="0"/></radialGradient>
    <linearGradient id="scan" x1="0" x2="1"><stop stop-color="#54f2e4" stop-opacity="0"/><stop offset=".48" stop-color="#c8fffa" stop-opacity=".92"/><stop offset="1" stop-color="#54f2e4" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1376" height="768" rx="34"/></clipPath>
    <style>
      .flow{fill:none;stroke:#70f7eb;stroke-width:3;stroke-linecap:round;stroke-dasharray:16 34;filter:url(#glow);animation:flow 4.8s linear infinite}
      .flow-slow{fill:none;stroke:#86fff3;stroke-width:2;stroke-dasharray:10 42;opacity:.72;animation:flow 7.6s linear infinite reverse}
      .core{transform-origin:688px 390px;animation:core 5s ease-in-out infinite}
      .node{transform-box:fill-box;transform-origin:center;animation:node 4.6s ease-in-out infinite}
      .node:nth-of-type(2){animation-delay:-1.2s}.node:nth-of-type(3){animation-delay:-2.35s}.node:nth-of-type(4){animation-delay:-3.1s}
      .scan{animation:scan 5s ease-in-out infinite}.shield{transform-origin:1018px 493px;animation:shield 5s ease-in-out infinite}.bar{transform-origin:0 0;animation:bar 5s ease-in-out infinite}
      .halo{transform-origin:688px 390px;animation:halo 5s ease-out infinite}
      @keyframes flow{to{stroke-dashoffset:-200}}@keyframes core{0%,100%{transform:scale(1);opacity:.76}42%{transform:scale(1.16);opacity:1}60%{transform:scale(1.04);opacity:.88}}
      @keyframes node{0%,100%{transform:translateY(0);opacity:.78}45%{transform:translateY(-7px);opacity:1}}
      @keyframes scan{0%,20%{transform:translateX(-190px);opacity:0}35%,62%{opacity:.85}88%,100%{transform:translateX(1320px);opacity:0}}
      @keyframes shield{0%,53%,100%{transform:scale(.86);opacity:.12}68%,86%{transform:scale(1.08);opacity:.82}}
      @keyframes bar{0%,42%,100%{transform:scaleX(1)}62%,82%{transform:scaleX(.52)}}@keyframes halo{0%{transform:scale(.68);opacity:.7}55%,100%{transform:scale(1.65);opacity:0}}
      @media(prefers-reduced-motion:reduce){.flow,.flow-slow,.core,.node,.scan,.shield,.bar,.halo{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <image href="kawa-ai-reference.jpeg" width="1376" height="768" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1376" height="768" fill="#06121d" opacity=".12"/>
    <path class="scan" d="M-180 660 H1480" stroke="url(#scan)" stroke-width="2" opacity=".56"/>
    <g class="halo"><circle cx="688" cy="390" r="72" fill="none" stroke="#7bfff5" stroke-width="2" opacity=".55"/></g>
    <g class="core"><circle cx="688" cy="390" r="110" fill="url(#core)" opacity=".76"/><circle cx="688" cy="390" r="66" fill="none" stroke="#a5fff8" stroke-width="2" opacity=".78" stroke-dasharray="5 12"/></g>
    <path class="flow" d="M86 390 H370 L500 298 M370 390 L505 435 M698 306 L701 352 M744 414 L916 480 M744 377 L906 300"/>
    <path class="flow-slow" d="M224 540 C420 610 520 630 690 542 C840 466 992 532 1202 434"/>
    <g class="node"><circle cx="505" cy="300" r="7" fill="#9cfff6" filter="url(#glow)"/><circle cx="505" cy="300" r="17" fill="none" stroke="#6ff4e7" opacity=".55"/></g>
    <g class="node"><circle cx="505" cy="435" r="7" fill="#9cfff6" filter="url(#glow)"/><circle cx="505" cy="435" r="17" fill="none" stroke="#6ff4e7" opacity=".55"/></g>
    <g class="node"><circle cx="912" cy="300" r="7" fill="#9cfff6" filter="url(#glow)"/><circle cx="912" cy="300" r="17" fill="none" stroke="#6ff4e7" opacity=".55"/></g>
    <g class="node"><circle cx="921" cy="480" r="7" fill="#9cfff6" filter="url(#glow)"/><circle cx="921" cy="480" r="17" fill="none" stroke="#6ff4e7" opacity=".55"/></g>
    <g class="shield"><path d="M1018 437 l42 18 v37 c0 34-24 58-42 67-18-9-42-33-42-67v-37z" fill="#7afbf0" opacity=".16" stroke="#b7fff9" stroke-width="3" filter="url(#glow)"/></g>
    <g transform="translate(1052 161)"><rect width="174" height="22" rx="11" fill="#07131e" opacity=".78" stroke="#526777"/><rect class="bar" x="5" y="5" width="160" height="12" rx="6" fill="#ffca67" opacity=".9"/><rect x="113" y="5" width="5" height="12" fill="#07131e" opacity=".82"/><rect x="137" y="5" width="5" height="12" fill="#07131e" opacity=".82"/></g>
    <rect x="20" y="20" width="1336" height="728" rx="28" fill="none" stroke="#8cfbf0" stroke-opacity=".18" stroke-width="2"/>
  </g>
</svg>
